# =============================================================
# docker-compose.yml — Local development environment
# =============================================================
# Services:
#   api       — Node.js API (with hot-reload via ts-node-dev)
#   postgres  — PostgreSQL 16 with pg_trgm ready
#   redis     — Redis 7 (single-node, mirrors ElastiCache config)
#
# Usage:
#   docker-compose up -d          # Start all services
#   docker-compose logs -f api    # Stream API logs
#   docker-compose down -v        # Stop and remove volumes
# =============================================================

services:
  # ── PostgreSQL ──────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: listings_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: listings_db
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Run pg_trgm migration on first boot
      - ./src/db/migrations/001_pg_trgm_setup.sql:/docker-entrypoint-initdb.d/001_pg_trgm_setup.sql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d listings_db']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - listings_net

  # ── Redis ────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: listings_redis
    restart: unless-stopped
    command: >
      redis-server
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --save 60 1
      --loglevel notice
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - listings_net

  # ── Node.js API ──────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder  # Use builder stage for dev (includes ts-node-dev)
    container_name: listings_api
    restart: unless-stopped
    command: npm run dev
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/listings_db?schema=public
      REDIS_HOST: redis
      REDIS_PORT: '6379'
      NODE_ENV: development
    ports:
      - '3000:3000'
    volumes:
      # Mount source for hot-reload (only in dev)
      - ./src:/app/src
      - ./prisma:/app/prisma
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - listings_net

# ── Volumes ──────────────────────────────────────────────────
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

# ── Network ──────────────────────────────────────────────────
networks:
  listings_net:
    driver: bridge
